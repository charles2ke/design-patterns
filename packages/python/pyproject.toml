
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "design-patterns-catalog"
version = "0.1.0"
description = "Installable catalog of the 23 Gang of Four design patterns with filtering helpers."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/design_patterns_catalog"]

name: README Sync

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/generate-readme.ts
      - web/src/data/patterns.ts
      - web/src/types/pattern.ts
      - .github/workflows/readme-sync.yml

jobs:
  sync-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes tsx scripts/generate-readme.ts
      - name: Commit updated README
        run: |
          if git diff --quiet README.md; then
            echo "README is already in sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: auto-update README"
          git push

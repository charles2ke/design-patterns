name: Packages Java

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - packages/java/**
      - .github/workflows/packages-java.yml

defaults:
  run:
    working-directory: packages/java

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - run: mvn -B -ntp -Dmaven.wagon.http.retryHandler.count=3 test

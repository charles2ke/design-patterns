name: Deploy Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Stamp build with deployed commit
        working-directory: web
        run: |
          mkdir -p public
          printf '{"commit":"%s","ref":"%s","builtAt":"%s"}\n' \
            "$GITHUB_SHA" "$GITHUB_REF_NAME" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > public/build-info.json

      - name: Build web app
        working-directory: web
        env:
          VITE_BASE_PATH: /design-patterns/
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: >-
          curl --fail --show-error --output /dev/null
          --retry 12 --retry-delay 5 --retry-all-errors
          "$PAGE_URL"

      - name: Verify deployed site is not stale
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if curl --fail --show-error --silent -H 'Cache-Control: no-cache' \
                 "${PAGE_URL}build-info.json?cb=${GITHUB_RUN_ID}-${attempt}" \
                 -o build-info.json \
               && grep -q "\"commit\":\"${GITHUB_SHA}\"" build-info.json; then
              echo "Deployed site serves commit ${GITHUB_SHA}."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Deployed site is stale; expected commit ${GITHUB_SHA}."
          cat build-info.json || true
          exit 1

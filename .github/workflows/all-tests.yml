name: All Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web-tests:
    name: Web Tests
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.upload-report.outputs.artifact-id }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:coverage
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - id: upload-report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  playwright-pr-comment:
    name: Playwright PR Comment
    needs: [web-tests]
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const result = '${{ needs.web-tests.result }}';
            const artifactId = '${{ needs.web-tests.outputs.artifact-id }}';
            const status = result === 'success' ? '✅ Passed' : result === 'failure' ? '❌ Failed' : '⚠️ ' + result;
            const reportLine = artifactId
              ? `📥 [Download Playwright Report & Screenshots](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}/artifacts/${artifactId})`
              : '_(report artifact unavailable)_';
            const body = [
              '## 🎭 Playwright Test Report',
              '',
              `**Status:** ${status}`,
              '',
              reportLine,
              '',
              '_The artifact contains the HTML report and screenshots for all e2e test runs._',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });

  npm-package:
    name: npm Package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/npm/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: npm-package
          path: packages/npm/dist
          retention-days: 7

  nuget-package:
    name: NuGet Package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/nuget
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build --configuration Release
      - run: dotnet test
      - run: dotnet pack --configuration Release --output ./nupkg
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: nuget-package
          path: packages/nuget/nupkg/*.nupkg
          retention-days: 7

  python-package:
    name: Python Package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: python-package
          path: packages/python/dist
          retention-days: 7

  go-package:
    name: Go Package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go test ./...

  rust-package:
    name: Rust Package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
      - run: cargo package
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: rust-crate
          path: packages/rust/target/package/*.crate
          retention-days: 7

  java-package:
    name: Java Package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - run: mvn -B -ntp -Dmaven.wagon.http.retryHandler.count=3 test
      - run: mvn -B -ntp -Dmaven.wagon.http.retryHandler.count=3 package -DskipTests
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: java-package
          path: packages/java/target/*.jar
          retention-days: 7

  all-pass:
    name: All Tests Passed
    runs-on: ubuntu-latest
    needs:
      - web-tests
      - npm-package
      - nuget-package
      - python-package
      - go-package
      - rust-package
      - java-package
    steps:
      - run: echo "All checks completed successfully."
